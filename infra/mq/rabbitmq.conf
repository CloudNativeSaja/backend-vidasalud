# Formacion automatica del cluster: ambos nodos se conocen por nombre
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Si un nodo no encuentra al otro al iniciar, reintenta antes de quedar solo
cluster_formation.discovery_retry_limit = 10
cluster_formation.discovery_retry_interval = 3000

# Estrategia ante particion de red en un cluster de 2 nodos
cluster_partition_handling = autoheal

# Expone metricas de los mensajes en la UI cada 5 s
collect_statistics_interval = 5000

server:
  port: ${APPOINTMENTS_PORT:8081}


spring:

  application:
    name: ms-vidasalud-appointments


  datasource:

    url: ${APPOINTMENTS_DB_URL:jdbc:mysql://127.0.0.1:3306/vidasalud_appointments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}

    username: ${DB_USERNAME:root}

    password: ${DB_PASSWORD:123456}

    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:

      hibernate:

        format_sql: true
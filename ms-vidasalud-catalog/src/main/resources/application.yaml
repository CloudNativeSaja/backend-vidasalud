server:
  port: ${CATALOG_PORT:8082}

spring:

  application:
    name: ms-vidasalud-catalog

  datasource:

    url: ${CATALOG_DB_URL:jdbc:mariadb://127.0.0.1:3306/vidasalud_catalog?useSSL=false&serverTimezone=America/Santiago}

    username: ${DB_USERNAME:root}

    password: ${DB_PASSWORD:123456}

    driver-class-name: org.mariadb.jdbc.Driver

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
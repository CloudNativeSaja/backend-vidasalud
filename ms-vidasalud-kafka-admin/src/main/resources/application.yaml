server:
  port: ${KAFKA_ADMIN_PORT:8088}

spring:
  application:
    name: ms-vidasalud-kafka-admin

  kafka:
    # Basta con alcanzar uno de los brokers: el cliente descubre el resto.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-vidasalud-kafka-admin

management:
  endpoints:
    web:
      exposure:
        include: health,info

# =====================================================================
# Configuracion del administrador de Kafka
# =====================================================================
vidasalud:
  kafka-admin:
    # Si Kafka no responde en este tiempo, la API contesta 503
    timeout: 5s
    # Valores por defecto al crear un topico sin indicarlos
    defaults:
      partitions: 3
      replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
    # Topicos base del caso: no se pueden eliminar desde la API
    protected-names:
      - vidasalud.appointments.events
      - vidasalud.audit.events
    # Unicas configuraciones de topico que la API permite modificar
    editable-configs:
      - retention.ms
      - retention.bytes
      - cleanup.policy
      - min.insync.replicas
      - max.message.bytes
      - segment.bytes
      - delete.retention.ms
      - compression.type

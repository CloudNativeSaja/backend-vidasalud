server:
  port: ${MQ_ADMIN_PORT:8085}

spring:
  application:
    name: ms-vidasalud-mq-admin

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASSWORD:vidasalud}
    virtual-host: /
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

vidasalud:
  mq-admin:
    vhost: /
    # API HTTP de RabbitMQ Management (listados, estado del cluster)
    management:
      url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      username: ${RABBITMQ_USER:vidasalud}
      password: ${RABBITMQ_PASSWORD:vidasalud}
    # Topologia base del caso: no se puede eliminar desde la API
    protected-names:
      - cmd.direct
      - cmd.topic
      - cmd.dead.dlx
      - q.cmd.email
      - q.cmd.email.dlq
      - q.cmd.admission
      - q.cmd.admission.dlq
      - q.cmd.record
      - q.cmd.record.dlq
